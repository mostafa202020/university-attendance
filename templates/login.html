{% extends "base.html" %}{% block title %}Teacher login{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-6"><div class="card app-card"><div class="card-body p-4 p-md-5">
<p class="text-primary text-uppercase small fw-semibold">Teacher access</p><h1 class="h3 fw-bold">Sign in</h1><p class="text-secondary">Manage courses, groups, sessions, and reports.</p>
<form method="post"><input type="hidden" name="next" value="{{ next }}"><div class="mb-3"><label class="form-label">Username</label><input class="form-control form-control-lg" name="username" required autocomplete="username"></div>
<div class="mb-4"><label class="form-label">Password</label><input class="form-control form-control-lg" name="password" type="password" required autocomplete="current-password"></div><button class="btn btn-primary btn-lg w-100">Sign in</button></form>
<p class="small text-secondary mt-3 mb-0">Set TEACHER_USERNAME and TEACHER_PASSWORD in your environment before deployment.</p></div></div></div></div>{% endblock %}
