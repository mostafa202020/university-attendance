<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Attendance Tracker{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f7fb}.app-card{border:0;border-radius:1rem;box-shadow:0 8px 28px rgba(30,41,59,.08)}.brand{width:2.5rem;height:2.5rem;display:inline-grid;place-items:center;border-radius:.8rem;background:#e0e7ff;color:#3730a3;font-weight:800}</style>
</head><body><nav class="navbar bg-white border-bottom"><div class="container">
<a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="{{ url_for('index') }}"><span class="brand">AT</span> Attendance Tracker</a>
<div class="d-flex gap-2 align-items-center">{% if teacher_logged_in %}<a class="btn btn-sm btn-outline-primary" href="{{ url_for('teacher_dashboard') }}">Teacher dashboard</a><form method="post" action="{{ url_for('teacher_logout') }}"><button class="btn btn-sm btn-outline-secondary">Log out</button></form>{% else %}<a class="btn btn-sm btn-outline-primary" href="{{ url_for('teacher_login') }}">Teacher login</a>{% endif %}</div>
</div></nav><main class="container py-4 py-md-5" style="max-width:1000px">
{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="alert alert-info">{{ m }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main></body></html>
